name: iOS unsigned .ipa (Briefcase → AltStore/Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-14
    env:
      PYTHON_VERSION: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase

      - name: Build iOS project
        run: |
          briefcase create iOS
          briefcase build iOS

      - name: Locate Xcode project and scheme
        id: xcode_meta
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_PATH="$(find build -type d -name '*.xcodeproj' | head -n 1)"
          SCHEME_NAME="$(basename "$PROJECT_PATH" .xcodeproj)"
          echo "xcode_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME_NAME" >> "$GITHUB_OUTPUT"
          echo "Found: $PROJECT_PATH, scheme: $SCHEME_NAME"

      - name: Archive project
        run: |
          mkdir -p output logs
          xcodebuild \
            -project "${{ steps.xcode_meta.outputs.xcode_path }}" \
            -scheme "${{ steps.xcode_meta.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath output/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            archive | tee logs/xcodebuild.log

      - name: Create unsigned .ipa
        run: |
          mkdir -p output/Payload
          APP_PATH=$(find output/App.xcarchive -name "*.app" | head -n 1)
          cp -R "$APP_PATH" output/Payload/
          cd output
          zip -qry app-unsigned.ipa Payload
          echo "Created app-unsigned.ipa"

      - name: Upload artifacts (.ipa and .xcarchive)
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa-and-archive
          path: |
            output/app-unsigned.ipa
            output/App.xcarchive
